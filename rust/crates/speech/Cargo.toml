[package]
name = "speech"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "On-device transcription (Whisper) and speech synthesis (Kokoro) for Rupa."

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "2.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.17"
